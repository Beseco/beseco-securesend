<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="shackle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle highlight top-left -->
  <ellipse cx="170" cy="130" rx="240" ry="180" fill="#ffffff" fill-opacity="0.06"/>

  <!-- Border glow -->
  <rect width="512" height="512" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>

  <!-- Shackle (padlock arch) -->
  <path d="M 180 292 L 180 202 A 76 76 0 0 1 332 202 L 332 292"
        fill="none"
        stroke="url(#shackle)"
        stroke-width="38"
        stroke-linecap="round"/>

  <!-- Lock body -->
  <rect x="118" y="272" width="276" height="214" rx="34" fill="url(#body)"/>

  <!-- Top sheen on lock body -->
  <rect x="118" y="272" width="276" height="54" rx="34" fill="#ffffff" fill-opacity="0.30"/>
  <rect x="118" y="308" width="276" height="18" fill="#ffffff" fill-opacity="0.30"/>

  <!-- Keyhole circle -->
  <circle cx="256" cy="358" r="33" fill="#1d4ed8" fill-opacity="0.85"/>

  <!-- Keyhole stem -->
  <rect x="241" y="374" width="30" height="50" rx="10" fill="#1d4ed8" fill-opacity="0.85"/>

  <!-- Keyhole inner highlight -->
  <circle cx="248" cy="351" r="9" fill="#ffffff" fill-opacity="0.20"/>

  <!-- Send badge (top-right) -->
  <circle cx="394" cy="106" r="44" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Arrow shaft -->
  <line x1="378" y1="122" x2="408" y2="90" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.92"/>
  <!-- Arrowhead horizontal -->
  <line x1="408" y1="90" x2="408" y2="104" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.92"/>
  <!-- Arrowhead vertical -->
  <line x1="394" y1="90" x2="408" y2="90" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.92"/>
</svg>
