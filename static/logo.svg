<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 80">
  <defs>
    <linearGradient id="badgeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <!-- Icon badge 72x72 -->
  <rect x="0" y="4" width="72" height="72" rx="14" fill="url(#badgeBg)"/>
  <rect x="0" y="4" width="72" height="72" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Mini shackle -->
  <path d="M 20 42 L 20 31 A 16 16 0 0 1 52 31 L 52 42"
        fill="none" stroke="url(#lockGrad)" stroke-width="7" stroke-linecap="round"/>

  <!-- Mini lock body -->
  <rect x="12" y="38" width="48" height="32" rx="7" fill="url(#lockGrad)"/>

  <!-- Mini keyhole -->
  <circle cx="36" cy="52" r="6" fill="#1d4ed8" fill-opacity="0.80"/>
  <rect x="33" y="56" width="6" height="9" rx="2" fill="#1d4ed8" fill-opacity="0.80"/>

  <!-- Text: "Beseco" light -->
  <text x="88" y="46"
        font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif"
        font-size="28" font-weight="400"
        fill="#111827">Beseco</text>

  <!-- Text: "SecureSend" bold blue -->
  <text x="88" y="46"
        font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif"
        font-size="28" font-weight="700"
        fill="#1a56db"
        dx="116">SecureSend</text>

  <!-- Tagline -->
  <text x="89" y="64"
        font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif"
        font-size="10" font-weight="500"
        fill="#6b7280"
        letter-spacing="1.1">SICHERE DATEIUEBERMITTLUNG · BESECO IT SYSTEMS</text>
</svg>
