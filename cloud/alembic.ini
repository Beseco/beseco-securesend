# alembic.ini — Alembic configuration for SecureSend Cloud

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names; default %%(rev)s_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file names
timezone = UTC

# Max length of revision slug
truncate_slug_length = 40

# Set to 'true' to run the env.py for every 'alembic' invocation
prepend_sys_path = .

# Version path separator; use the first character of this string
version_path_separator = os

# Output encoding used when revision files are written from script.py.mako
# output_encoding = utf-8

sqlalchemy.url = sqlite+aiosqlite:///./securesend.db

[post_write_hooks]
# Post-write hooks; see https://alembic.sqlalchemy.org/en/latest/api/config.html

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
