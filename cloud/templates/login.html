<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anmelden – SecureSend Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2057 100%); min-height: 100vh; }
    .login-card { background: #fff; border-radius: 1rem; padding: 2.5rem; width: 100%; max-width: 26rem; box-shadow: 0 25px 60px rgba(0,0,0,0.35); }
    .form-input {
      width: 100%; padding: 0.625rem 0.875rem; border: 1px solid #e2e8f0;
      border-radius: 0.5rem; font-size: 0.9375rem; color: #1e293b;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
      box-sizing: border-box;
    }
    .form-input:focus { border-color: #1a56db; box-shadow: 0 0 0 3px rgba(26,86,219,0.12); }
    .btn-login {
      width: 100%; padding: 0.75rem; background: #1a56db; color: #fff;
      font-size: 0.9375rem; font-weight: 700; border: none; border-radius: 0.5rem;
      cursor: pointer; transition: background 0.15s; letter-spacing: 0.01em;
    }
    .btn-login:hover { background: #1d4ed8; }
    .btn-login:disabled { background: #93c5fd; cursor: not-allowed; }
  </style>
</head>
<body class="h-full flex items-center justify-center px-4">

  <div class="login-card">
    <!-- Logo -->
    <div style="text-align:center;margin-bottom:1.75rem;">
      <div style="display:inline-flex;align-items:center;justify-content:center;background:#1a56db;border-radius:0.875rem;padding:0.875rem;margin-bottom:1rem;">
        <svg style="width:2rem;height:2rem;color:#fff" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
      </div>
      <h1 style="font-size:1.5rem;font-weight:800;color:#1e293b;letter-spacing:-0.02em;">SecureSend Cloud</h1>
      <p style="font-size:0.875rem;color:#64748b;margin-top:0.25rem;">Melden Sie sich mit Ihrem Konto an</p>
    </div>

    <!-- Error message -->
    {% if error %}
    <div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:0.5rem;padding:0.75rem 1rem;margin-bottom:1.25rem;font-size:0.875rem;color:#991b1b;display:flex;align-items:center;gap:0.5rem;">
      <svg style="width:1rem;height:1rem;flex-shrink:0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      {{ error }}
    </div>
    {% endif %}

    <!-- Form -->
    <form method="post" action="/ui/login" id="loginForm">
      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:0.8125rem;font-weight:600;color:#374151;margin-bottom:0.375rem;" for="email">
          E-Mail-Adresse
        </label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-input"
          placeholder="name@unternehmen.de"
          value="{{ prefill_email or '' }}"
          required
          autocomplete="email"
          autofocus
        />
      </div>

      <div style="margin-bottom:1.5rem;">
        <label style="display:block;font-size:0.8125rem;font-weight:600;color:#374151;margin-bottom:0.375rem;" for="password">
          Passwort
        </label>
        <div style="position:relative;">
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="••••••••"
            required
            autocomplete="current-password"
            style="padding-right:2.75rem;"
          />
          <button type="button" onclick="togglePwd()" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#94a3b8;" tabindex="-1">
            <svg id="eyeIcon" style="width:1.125rem;height:1.125rem;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">
        <span id="btnText">Anmelden</span>
      </button>
    </form>

    <p style="text-align:center;margin-top:1.5rem;font-size:0.8125rem;color:#94a3b8;">
      SecureSend Cloud &copy; {{ current_year }} &mdash; Sicheres Senden
    </p>
  </div>

  <script>
    function togglePwd() {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }
    document.getElementById('loginForm').addEventListener('submit', function() {
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('btnText').textContent = 'Anmelden…';
    });
  </script>
</body>
</html>
