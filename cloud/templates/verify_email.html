<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Mail bestätigen – SecureSend Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2057 100%); min-height: 100vh; }
    .card { background: #fff; border-radius: 1rem; padding: 2.5rem; width: 100%; max-width: 26rem; box-shadow: 0 25px 60px rgba(0,0,0,0.35); text-align: center; }
    .btn { display:inline-block; padding: 0.625rem 1.5rem; background: #1a56db; color: #fff;
      font-size: 0.9375rem; font-weight: 700; border: none; border-radius: 0.5rem;
      cursor: pointer; text-decoration: none; transition: background 0.15s; }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body class="h-full flex items-center justify-center px-4">

  <div class="card">
    {% if success %}
    <!-- Success -->
    <div style="display:inline-flex;align-items:center;justify-content:center;background:#dcfce7;border-radius:50%;padding:1rem;margin-bottom:1.25rem;">
      <svg style="width:2rem;height:2rem;color:#16a34a" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h1 style="font-size:1.375rem;font-weight:800;color:#166534;margin-bottom:0.75rem;">E-Mail bestätigt!</h1>
    <p style="font-size:0.9375rem;color:#374151;margin-bottom:1.5rem;">{{ message }}</p>
    <a href="/ui/login" class="btn">Zur Anmeldung</a>

    {% else %}
    <!-- Error -->
    <div style="display:inline-flex;align-items:center;justify-content:center;background:#fee2e2;border-radius:50%;padding:1rem;margin-bottom:1.25rem;">
      <svg style="width:2rem;height:2rem;color:#dc2626" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </div>
    <h1 style="font-size:1.375rem;font-weight:800;color:#991b1b;margin-bottom:0.75rem;">Bestätigung fehlgeschlagen</h1>
    <p style="font-size:0.9375rem;color:#374151;margin-bottom:1.5rem;">{{ message }}</p>
    <a href="/ui/login" class="btn" style="background:#64748b;">Zur Anmeldung</a>
    {% endif %}

    <p style="margin-top:1.5rem;font-size:0.75rem;color:#cbd5e1;">
      SecureSend Cloud &copy; {{ current_year }}
    </p>
  </div>

</body>
</html>
