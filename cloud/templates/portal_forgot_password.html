<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passwort vergessen – Gast-Portal</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f1f5f9; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .card { background: #fff; border-radius: 0.75rem; padding: 2rem; width: 100%; max-width: 22rem; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; color: #0f172a; }
    .sub { font-size: 0.875rem; color: #64748b; margin-bottom: 1.25rem; line-height: 1.45; }
    label { display: block; font-size: 0.8125rem; font-weight: 600; color: #475569; margin-bottom: 0.25rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.5rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.9375rem; }
    button { width: 100%; padding: 0.625rem; background: #1a56db; color: #fff; border: none; border-radius: 0.5rem; font-weight: 700; cursor: pointer; font-size: 0.9375rem; }
    button:hover { background: #1d4ed8; }
    .err { background: #fee2e2; color: #991b1b; padding: 0.75rem; border-radius: 0.5rem; font-size: 0.875rem; margin-bottom: 1rem; }
    .msg { background: #ecfdf5; color: #065f46; padding: 0.75rem; border-radius: 0.5rem; font-size: 0.8125rem; margin-bottom: 1rem; line-height: 1.45; }
    .back { text-align: center; margin-top: 1rem; }
    .back a { font-size: 0.8125rem; color: #1a56db; font-weight: 600; text-decoration: none; }
    .back a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Passwort vergessen</h1>
    <p class="sub">Geben Sie die E-Mail Ihres Gastkontos ein. Wir leiten Sie zum sicheren Zurücksetzen (per E-Mail oder SMS an die hinterlegte Nummer).</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    {% if message %}<div class="msg">{{ message }}</div>{% endif %}
    <form method="post" action="/portal/forgot-password">
      <label for="email">E-Mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required value="{{ email or '' }}" />
      <button type="submit">Weiter</button>
    </form>
    <p class="back"><a href="/portal/login">← Zurück zur Anmeldung</a></p>
  </div>
</body>
</html>
