{% extends "base.html" %}
{% block title %}Verlauf – SecureSend Cloud{% endblock %}
{% block page_title %}Sendungsverlauf{% endblock %}

{% block content %}
<div class="card" style="overflow:hidden;">
  <!-- Toolbar -->
  <div style="padding:1rem 1.25rem;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;gap:1rem;">
    <div style="position:relative;flex:1;max-width:22rem;">
      <svg style="position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);width:0.875rem;height:0.875rem;color:#94a3b8;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Suchen…" oninput="filterHistory()" style="width:100%;padding:0.5rem 0.75rem 0.5rem 2.25rem;border:1px solid #e2e8f0;border-radius:0.5rem;font-size:0.875rem;outline:none;box-sizing:border-box;" onfocus="this.style.borderColor='#1a56db'" onblur="this.style.borderColor='#e2e8f0'"/>
    </div>
    <div id="historyCount" style="font-size:0.8125rem;color:#64748b;white-space:nowrap;"></div>
    <a href="/ui/send" class="btn-primary" style="display:inline-flex;align-items:center;gap:0.375rem;font-size:0.875rem;text-decoration:none;padding:0.5rem 1rem;">
      <svg style="width:0.875rem;height:0.875rem" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
      </svg>
      Neu senden
    </a>
  </div>

  <!-- Table -->
  <div style="overflow-x:auto;">
    <table style="width:100%;border-collapse:collapse;" id="historyTable">
      <thead>
        <tr class="table-header">
          <th style="padding:0.625rem 1.25rem;text-align:left;font-size:0.75rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;">Datum</th>
          <th style="padding:0.625rem 1rem;text-align:left;font-size:0.75rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;">Empfänger</th>
          <th style="padding:0.625rem 1rem;text-align:left;font-size:0.75rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;">Dateiname</th>
          <th style="padding:0.625rem 1rem;text-align:left;font-size:0.75rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;">Anbieter</th>
          <th style="padding:0.625rem 1rem;text-align:left;font-size:0.75rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;">Link</th>
          <th style="padding:0.625rem 1rem;text-align:center;font-size:0.75rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;">Ablauf</th>
          <th style="padding:0.625rem 1.25rem;text-align:center;font-size:0.75rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap;">Sicherheit</th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <tr>
          <td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;">
            <div style="display:flex;flex-direction:column;align-items:center;gap:0.75rem;">
              <svg style="width:2.5rem;height:2.5rem;opacity:0.4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <span>Lade Verlauf…</span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  let allHistory = [];

  async function loadHistory() {
    try {
      const res = await apiFetch('/ui/api/history');
      if (res.ok) {
        allHistory = await res.json();
        renderHistory(allHistory);
        document.getElementById('historyCount').textContent = allHistory.length + ' Einträge';
      } else {
        renderEmpty('Fehler beim Laden');
      }
    } catch(e) {
      renderEmpty('Netzwerkfehler');
    }
  }

  function renderEmpty(msg) {
    document.getElementById('historyBody').innerHTML = `<tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;">${msg}</td></tr>`;
  }

  function renderHistory(items) {
    const tbody = document.getElementById('historyBody');
    if (items.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:0.75rem;">
          <svg style="width:2.5rem;height:2.5rem;opacity:0.4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>Noch keine Sendungen vorhanden</span>
        </div>
      </td></tr>`;
      return;
    }
    tbody.innerHTML = items.map(h => {
      const dt = new Date(h.created_at);
      const dateStr = dt.toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'});
      const timeStr = dt.toLocaleTimeString('de-DE', {hour:'2-digit',minute:'2-digit'});
      const recipientDisplay = [h.to_email, h.to_phone].filter(Boolean).join(' / ') || '—';
      const secBadge = h.security_level === 'high'
        ? `<span style="background:#fef3c7;color:#92400e;font-size:0.7rem;font-weight:700;padding:0.125rem 0.5rem;border-radius:9999px;">Erhöht</span>`
        : `<span style="background:#f1f5f9;color:#475569;font-size:0.7rem;font-weight:700;padding:0.125rem 0.5rem;border-radius:9999px;">Normal</span>`;
      const providerIcon = h.provider === 'nextcloud'
        ? '<span style="background:#e0f2fe;color:#0369a1;font-size:0.7rem;font-weight:700;padding:0.125rem 0.5rem;border-radius:9999px;">Nextcloud</span>'
        : '<span style="background:#ede9fe;color:#7c3aed;font-size:0.7rem;font-weight:700;padding:0.125rem 0.5rem;border-radius:9999px;">OneDrive</span>';

      return `<tr class="table-row" style="border-top:1px solid #f1f5f9;">
        <td style="padding:0.75rem 1.25rem;white-space:nowrap;">
          <div style="font-size:0.875rem;font-weight:600;color:#1e293b;">${dateStr}</div>
          <div style="font-size:0.75rem;color:#94a3b8;">${timeStr}</div>
        </td>
        <td style="padding:0.75rem 1rem;font-size:0.875rem;color:#475569;max-width:12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(recipientDisplay)}</td>
        <td style="padding:0.75rem 1rem;font-size:0.875rem;color:#1e293b;max-width:14rem;">
          <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(h.filename)}">${esc(h.filename)}</div>
        </td>
        <td style="padding:0.75rem 1rem;">${providerIcon}</td>
        <td style="padding:0.75rem 1rem;max-width:10rem;">
          ${h.share_url
            ? `<a href="${esc(h.share_url)}" target="_blank" style="font-size:0.8125rem;color:#1a56db;text-decoration:none;display:flex;align-items:center;gap:0.25rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                <svg style="width:0.75rem;height:0.75rem;flex-shrink:0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                Öffnen
              </a>`
            : '<span style="color:#cbd5e1;font-size:0.8125rem;">—</span>'}
        </td>
        <td style="padding:0.75rem 1rem;text-align:center;font-size:0.875rem;color:#475569;">${h.expiry_days}d</td>
        <td style="padding:0.75rem 1.25rem;text-align:center;">${secBadge}</td>
      </tr>`;
    }).join('');
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function filterHistory() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allHistory.filter(h =>
      (h.to_email + h.to_phone + h.filename + h.provider).toLowerCase().includes(q)
    );
    renderHistory(filtered);
    document.getElementById('historyCount').textContent = filtered.length + ' / ' + allHistory.length + ' Einträge';
  }

  loadHistory();
</script>
{% endblock %}
