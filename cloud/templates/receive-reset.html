<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort vergessen – SecureSend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-8">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">
                🔑 Passwort zurücksetzen
            </h1>
            <p class="text-gray-600 mt-1">
                Wählen Sie eine Methode zum Zurücksetzen
            </p>
        </div>
        
        <!-- Messages -->
        {% if message %}
        <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-4">
            {{ message }}
        </div>
        {% endif %}
        
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4">
            {{ error }}
        </div>
        {% endif %}
        
        <!-- Reset Options -->
        <div class="space-y-4">
            <form method="POST" action="/r/reset/{{ token }}">
                <input type="hidden" name="method" value="email">
                <button 
                    type="submit"
                    class="w-full flex items-center justify-between p-4 border rounded-lg hover:bg-gray-50 transition"
                >
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">✉️</span>
                        <div class="text-left">
                            <p class="font-medium">E-Mail</p>
                            <p class="text-sm text-gray-500">Link zum Zurücksetzen erhalten</p>
                        </div>
                    </div>
                    <span class="text-gray-400">→</span>
                </button>
            </form>
            
            <form method="POST" action="/r/reset/{{ token }}">
                <input type="hidden" name="method" value="sms">
                <button 
                    type="submit"
                    class="w-full flex items-center justify-between p-4 border rounded-lg hover:bg-gray-50 transition"
                >
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">📱</span>
                        <div class="text-left">
                            <p class="font-medium">SMS</p>
                            <p class="text-sm text-gray-500">PIN per SMS erhalten</p>
                        </div>
                    </div>
                    <span class="text-gray-400">→</span>
                </button>
            </form>
        </div>
        
        <!-- New Password Form (after code verification) -->
        <div class="mt-6 pt-6 border-t">
            <h3 class="font-medium text-gray-900 mb-3">Neues Passwort setzen</h3>
            <form method="POST" action="/r/reset/{{ token }}/confirm">
                <div class="space-y-4">
                    <div>
                        <input 
                            type="password" 
                            name="code" 
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg"
                            placeholder="Code eingeben"
                        >
                    </div>
                    <div>
                        <input 
                            type="password" 
                            name="password" 
                            required
                            minlength="8"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg"
                            placeholder="Neues Passwort"
                        >
                    </div>
                    <div>
                        <input 
                            type="password" 
                            name="password2" 
                            required
                            minlength="8"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg"
                            placeholder="Passwort bestätigen"
                        >
                    </div>
                    <button 
                        type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition"
                    >
                        Passwort setzen
                    </button>
                </div>
            </form>
        </div>
        
        <!-- Back Link -->
        <p class="text-center text-sm text-gray-500 mt-6">
            <a href="/r/dashboard/{{ token }}" class="text-blue-600 hover:underline">
                ← Zurück zum Dashboard
            </a>
        </p>
    </div>
</body>
</html>
