<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort vergessen – SecureSend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: system-ui, -apple-system, sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg max-w-md w-full p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">🔑 Passwort zurücksetzen</h1>
            <p class="text-gray-600 mt-1">Link per E-Mail oder PIN per SMS</p>
        </div>

        {% if message %}
        <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-4">{{ message }}</div>
        {% endif %}
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4">{{ error }}</div>
        {% endif %}

        <div class="space-y-3 mb-6">
            <form method="POST" action="/r/reset/{{ token }}">
                <input type="hidden" name="method" value="email" />
                <button type="submit" class="w-full flex items-center justify-between p-4 border rounded-lg hover:bg-gray-50 transition">
                    <span class="font-medium">✉️ Link per E-Mail</span>
                    <span class="text-gray-400">→</span>
                </button>
            </form>
            <form method="POST" action="/r/reset/{{ token }}">
                <input type="hidden" name="method" value="sms" />
                <button type="submit" class="w-full flex items-center justify-between p-4 border rounded-lg hover:bg-gray-50 transition">
                    <span class="font-medium">📱 PIN per SMS</span>
                    <span class="text-gray-400">→</span>
                </button>
            </form>
        </div>

        <div class="border-t pt-6">
            <h3 class="font-medium text-gray-900 mb-2">Neues Passwort setzen</h3>
            <p class="text-xs text-gray-500 mb-3">10+ Zeichen, Groß-/Kleinbuchstabe, Ziffer, Sonderzeichen.</p>
            <form method="POST" action="/r/reset/{{ token }}/confirm">
                <div class="space-y-3">
                    <input type="text" name="code" value="{{ prefilled_code }}" required autocomplete="one-time-code"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg"
                        placeholder="Link-Token oder SMS-Code" />
                    <input type="password" name="password" required minlength="10" autocomplete="new-password"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="Neues Passwort" />
                    <input type="password" name="password2" required minlength="10" autocomplete="new-password"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="Passwort bestätigen" />
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg">Passwort setzen</button>
                </div>
            </form>
        </div>

        <p class="text-center text-sm text-gray-500 mt-6">
            <a href="/r/dashboard/{{ token }}" class="text-blue-600 hover:underline">← Zurück zum Posteingang</a>
        </p>
    </div>
</body>
</html>
