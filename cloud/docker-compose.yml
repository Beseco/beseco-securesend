services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securesend}
      POSTGRES_USER: ${POSTGRES_USER:-securesend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securesend}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Override SQLite default with PostgreSQL for production
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-securesend}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-securesend}"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    volumes:
      # Mount project root so core.* modules are importable at /project/core
      - ..:/project:ro
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  db_data:
