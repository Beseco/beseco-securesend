version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: securesend_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: securesend
      POSTGRES_USER: securesend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securesend_pw_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securesend -d securesend"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - securesend_network

  securesend:
    build: .
    container_name: securesend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    volumes:
      - securesend_files:/data
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://your-domain.com}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # SMTP (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # SMS Gateway (optional)
      SIPGATE_TOKEN_ID: ${SIPGATE_TOKEN_ID:-}
      SIPGATE_DEVICE_ID: ${SIPGATE_DEVICE_ID:-}
    networks:
      - securesend_network

volumes:
  postgres_data:
  securesend_files:

networks:
  securesend_network:
    driver: bridge