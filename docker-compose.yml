services:
  securesend:
    build: .
    container_name: securesend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"   # nur lokal — nginx/proxy macht SSL nach außen
    volumes:
      - securesend_data:/data
    env_file:
      - cloud/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/securesend.db
      UVICORN_HOST: "0.0.0.0"
      PUBLIC_BASE_URL: "https://securesend.cloud-fs.de"

volumes:
  securesend_data:
