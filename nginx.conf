# nginx Reverse Proxy für securesend.cloud-fs.de
# Ablegen unter: /etc/nginx/sites-available/securesend
# Aktivieren:    ln -s /etc/nginx/sites-available/securesend /etc/nginx/sites-enabled/
# SSL:           certbot --nginx -d securesend.cloud-fs.de

server {
    listen 80;
    server_name securesend.cloud-fs.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name securesend.cloud-fs.de;

    # SSL — wird von certbot automatisch befüllt
    # ssl_certificate     /etc/letsencrypt/live/securesend.cloud-fs.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/securesend.cloud-fs.de/privkey.pem;

    # Datei-Uploads bis 110 MB
    client_max_body_size 110M;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
