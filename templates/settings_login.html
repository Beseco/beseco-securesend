<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Einstellungen · Anmelden · Beseco SecureSend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue:      #1a56db;
      --blue-dark: #1240a8;
      --blue-pale: #eff4ff;
      --gray-900:  #111827;
      --gray-700:  #374151;
      --gray-500:  #6b7280;
      --gray-200:  #e5e7eb;
      --gray-50:   #f9fafb;
      --green:     #16a34a;
      --red:       #dc2626;
      --radius:    10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      color: var(--gray-900);
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a56db 0%, #1e40af 100%);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 16px rgba(0,0,0,.3);
    }
    .logo-icon {
      width: 38px; height: 38px;
      background: rgba(255,255,255,.18);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    header h1 { color: #fff; font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
    header p  { color: rgba(255,255,255,.65); font-size: 12px; letter-spacing: .8px; text-transform: uppercase; margin-top: 1px; }
    .header-back {
      margin-left: auto;
      color: rgba(255,255,255,.8);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 7px;
      transition: background .15s;
    }
    .header-back:hover { background: rgba(255,255,255,.12); }

    /* ── Content ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,.12);
      overflow: hidden;
      width: 100%;
      max-width: 400px;
    }
    .card-header {
      padding: 18px 24px;
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-header span {
      font-size: 16px;
      font-weight: 700;
      color: var(--gray-700);
    }
    .card-body {
      padding: 24px;
    }

    /* ── Form ── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--gray-500);
    }
    input[type="password"] {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      padding: 10px 12px;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      color: var(--gray-900);
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
      outline: none;
      width: 100%;
    }
    input[type="password"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(26,86,219,.12);
    }
    input::placeholder { color: #c0c8d4; }

    /* ── Button ── */
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #1a56db, #1e40af);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
    }
    .submit-btn:hover { opacity: .9; }

    /* ── Error ── */
    .error-box {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--red);
      margin-bottom: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<header>
  <div class="logo-icon">🔒</div>
  <div>
    <h1>Beseco SecureSend</h1>
    <p>Einstellungen · Anmeldung</p>
  </div>
  <a class="header-back" href="/">← Zurück zur App</a>
</header>

<main>
  <div class="card">
    <div class="card-header">
      <span>🔒 Einstellungen</span>
    </div>
    <div class="card-body">
      {% if error %}
      <div class="error-box">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/settings/auth">
        <div class="field">
          <label>Passwort</label>
          <input type="password" name="password" placeholder="••••••••••••" autofocus>
        </div>
        <button type="submit" class="submit-btn">Anmelden</button>
      </form>
    </div>
  </div>
</main>

</body>
</html>
