<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Beseco SecureSend{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["'IBM Plex Sans'", 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ["'IBM Plex Mono'", 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'IBM Plex Sans', sans-serif; }
    #sidebar { transition: width 0.25s cubic-bezier(0.4,0,0.2,1); }
    #main-wrapper { transition: margin-left 0.25s cubic-bezier(0.4,0,0.2,1); }
    .sb-label { transition: opacity 0.2s ease, max-width 0.25s ease; overflow: hidden; white-space: nowrap; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    {% block extra_css %}{% endblock %}
  </style>
</head>
<body class="bg-slate-950 min-h-screen antialiased">

<!-- Mobile overlay -->
<div id="sb-overlay" class="fixed inset-0 z-40 bg-black/60 hidden" onclick="closeMobileSidebar()"></div>

<div class="flex min-h-screen">

  <!-- ═══ SIDEBAR ═══ -->
  <aside id="sidebar"
         class="fixed inset-y-0 left-0 z-50 flex flex-col bg-slate-900 border-r border-slate-800"
         style="width:240px;">

    <!-- Logo + Hamburger -->
    <div class="flex items-center h-16 px-3 border-b border-slate-800 gap-2 flex-shrink-0">
      <img src="/static/icon.svg" alt="Beseco" class="w-9 h-9 rounded-xl flex-shrink-0">
      <div class="sb-label flex-1" style="max-width:160px;">
        <div class="text-white font-bold text-sm leading-none tracking-tight">Beseco</div>
        <div class="text-slate-400 text-xs mt-0.5 font-medium">SecureSend</div>
      </div>
      <button onclick="toggleSidebar()"
              class="ml-auto p-1.5 rounded-lg text-slate-500 hover:text-slate-200 hover:bg-slate-700/70 transition-colors flex-shrink-0"
              title="Menü ein/ausklappen">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
        </svg>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 py-3 px-2 space-y-0.5 overflow-y-auto overflow-x-hidden">

      <a href="/" title="Senden"
         class="sb-nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-150
                {% if active == 'send' %}bg-blue-600 text-white shadow-lg shadow-blue-900/40{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
        </svg>
        <span class="sb-label text-sm font-medium" style="max-width:160px;">Senden</span>
      </a>

      <a href="/contacts" title="Adressbuch"
         class="sb-nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-150
                {% if active == 'contacts' %}bg-blue-600 text-white shadow-lg shadow-blue-900/40{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/>
        </svg>
        <span class="sb-label text-sm font-medium" style="max-width:160px;">Adressbuch</span>
      </a>

      <a href="/history" title="History"
         class="sb-nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-150
                {% if active == 'history' %}bg-blue-600 text-white shadow-lg shadow-blue-900/40{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="sb-label text-sm font-medium" style="max-width:160px;">History</span>
      </a>

      <a href="/settings" title="Einstellungen"
         class="sb-nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all duration-150
                {% if active == 'settings' %}bg-blue-600 text-white shadow-lg shadow-blue-900/40{% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span class="sb-label text-sm font-medium" style="max-width:160px;">Einstellungen</span>
      </a>

    </nav>

    <!-- Sidebar Footer -->
    <div class="px-4 py-3 border-t border-slate-800 flex-shrink-0">
      <div class="sb-label text-xs text-slate-600 truncate font-medium" style="max-width:160px;">v1.0 · Beseco IT Systems</div>
    </div>

  </aside>

  <!-- ═══ MAIN WRAPPER ═══ -->
  <div id="main-wrapper" class="flex flex-col flex-1 min-w-0" style="margin-left:240px;">

    <!-- Top Bar -->
    <header class="sticky top-0 z-30 flex items-center h-14 gap-3 bg-white border-b border-slate-200 px-5 shadow-sm flex-shrink-0">
      <!-- Mobile hamburger (only visible on small screens) -->
      <button class="lg:hidden p-2 -ml-1 rounded-lg text-slate-500 hover:bg-slate-100"
              onclick="toggleMobileSidebar()">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
        </svg>
      </button>

      <!-- Breadcrumb -->
      <div class="flex items-center gap-1.5 text-sm min-w-0">
        <span class="text-slate-400 font-medium hidden sm:inline">SecureSend</span>
        <span class="text-slate-300 hidden sm:inline">/</span>
        <span class="text-slate-700 font-semibold truncate">{% block page_title %}{% endblock %}</span>
      </div>

      <!-- Right slot -->
      <div class="ml-auto flex items-center gap-2 flex-shrink-0">
        {% block topbar_right %}{% endblock %}
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 {% block main_class %}p-6 bg-slate-50{% endblock %}">
      {% block content %}{% endblock %}
    </main>

  </div>
</div>

<!-- Toast (global) -->
<div id="toast"
     class="fixed bottom-5 right-5 z-[9999] bg-white rounded-xl shadow-2xl px-4 py-3.5 text-sm font-semibold
            opacity-0 translate-y-2 pointer-events-none transition-all duration-300 max-w-xs border-l-4"
     style="border-left-color: #16a34a;">
</div>

<script>
  // ── Sidebar state ──
  let _sbCollapsed = localStorage.getItem('sb_collapsed') === 'true';
  let _sbMobileOpen = false;

  function _applySb() {
    const sb  = document.getElementById('sidebar');
    const mw  = document.getElementById('main-wrapper');
    const isDesktop = window.innerWidth >= 1024;
    if (isDesktop) {
      const w = _sbCollapsed ? '64px' : '240px';
      sb.style.width = w;
      mw.style.marginLeft = w;
      // Labels & footer text
      sb.querySelectorAll('.sb-label').forEach(el => {
        el.style.maxWidth = _sbCollapsed ? '0' : '160px';
        el.style.opacity  = _sbCollapsed ? '0' : '1';
      });
      // Center icons when collapsed
      sb.querySelectorAll('.sb-nav-item').forEach(el => {
        el.style.justifyContent = _sbCollapsed ? 'center' : '';
        el.style.paddingLeft    = _sbCollapsed ? '0' : '';
        el.style.paddingRight   = _sbCollapsed ? '0' : '';
      });
      document.getElementById('sb-overlay').classList.add('hidden');
    }
  }

  function toggleSidebar() {
    if (window.innerWidth >= 1024) {
      _sbCollapsed = !_sbCollapsed;
      localStorage.setItem('sb_collapsed', _sbCollapsed);
      _applySb();
    } else {
      toggleMobileSidebar();
    }
  }

  function toggleMobileSidebar() {
    _sbMobileOpen = !_sbMobileOpen;
    const sb  = document.getElementById('sidebar');
    const ov  = document.getElementById('sb-overlay');
    sb.style.transform  = _sbMobileOpen ? 'translateX(0)' : 'translateX(-100%)';
    _sbMobileOpen ? ov.classList.remove('hidden') : ov.classList.add('hidden');
  }

  function closeMobileSidebar() {
    _sbMobileOpen = false;
    document.getElementById('sidebar').style.transform = 'translateX(-100%)';
    document.getElementById('sb-overlay').classList.add('hidden');
  }

  function _initSb() {
    const sb = document.getElementById('sidebar');
    const mw = document.getElementById('main-wrapper');
    if (window.innerWidth < 1024) {
      sb.style.transform   = 'translateX(-100%)';
      sb.style.width       = '240px';
      mw.style.marginLeft  = '0';
      sb.querySelectorAll('.sb-label').forEach(el => { el.style.maxWidth = '160px'; el.style.opacity = '1'; });
      sb.querySelectorAll('.sb-nav-item').forEach(el => { el.style.justifyContent = ''; el.style.paddingLeft = ''; el.style.paddingRight = ''; });
    } else {
      sb.style.transform = '';
      _applySb();
    }
  }

  _initSb();
  window.addEventListener('resize', _initSb);

  // ── Global toast ──
  let _toastTimer;
  function showToast(type, msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.borderLeftColor = type === 'ok' ? '#16a34a' : '#dc2626';
    t.style.color = type === 'ok' ? '#15803d' : '#dc2626';
    t.classList.remove('opacity-0', 'translate-y-2');
    t.classList.add('opacity-100', 'translate-y-0');
    t.style.pointerEvents = 'auto';
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => {
      t.classList.add('opacity-0', 'translate-y-2');
      t.classList.remove('opacity-100', 'translate-y-0');
      t.style.pointerEvents = 'none';
    }, 3500);
  }
</script>

{% block scripts %}{% endblock %}
</body>
</html>
